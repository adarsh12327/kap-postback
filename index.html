<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAP — Web Login</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#080d19,#111b31);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);padding:30px 24px;border:1px solid #263552;border-radius:24px;background:#10192b;box-shadow:0 20px 60px #0007;text-align:center}
.logo{width:74px;height:74px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#5875ff;font-size:30px;font-weight:900}
h1{margin:18px 0 8px;font-size:28px}.sub{color:#aab7d0;line-height:1.5}
.status{margin-top:22px;padding:14px;border-radius:14px;background:#0a1222;color:#c9d4e9;line-height:1.45}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:13px;background:#5875ff;color:white;font-size:16px;font-weight:800}
.small{margin-top:14px;color:#7786a3;font-size:12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">K</div>
<h1>KAP Web Login</h1>
<p class="sub">Secure login using your Telegram account.</p>
<div id="status" class="status">Checking Telegram Mini App…</div>
<button id="open" hidden>Open from Telegram</button>
<p class="small">No Telegram or third-party OTP is requested on this page.</p>
</main>
<script>
const tg=window.Telegram?.WebApp;
const status=document.getElementById("status"),open=document.getElementById("open");
if(tg){
  tg.ready(); tg.expand();
  if(tg.initData){
    fetch("/api/miniapp",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({initData:tg.initData})})
    .then(r=>r.json()).then(x=>{
      if(x.ok && x.user){
        status.innerHTML="✅ Logged in as <b>"+(x.user.first_name||"Telegram user")+"</b>";
      }else status.textContent=x.error||"Telegram authentication failed.";
    }).catch(()=>status.textContent="Connection error. Please try again.");
  }else{
    status.textContent="Open this page from the KAP Telegram bot to sign in.";
  }
}else{
  status.textContent="Open this page from the KAP Telegram bot to sign in.";
}
</script>
</body>
</html>
