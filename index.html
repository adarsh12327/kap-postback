<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KAP Login</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#fff;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#121a2d;border:1px solid #263454;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}.logo{font-size:28px;font-weight:800}.sub{color:#9eabc5;margin:8px 0 26px}.profile{display:none;text-align:center}.profile.show{display:block}.avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;object-fit:cover;background:#263454}.name{font-size:22px;font-weight:800}.id{color:#94a3b8;font-size:13px;margin-top:5px}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:#5b7cff;color:#fff;font-weight:700;font-size:16px}button.secondary{background:#263454}.msg{min-height:24px;margin-top:16px;font-size:14px;text-align:center}.ok{color:#6ee7b7}.err{color:#fca5a5}.muted{color:#94a3b8;text-align:center;margin-top:18px;font-size:12px;line-height:1.5}</style></head>
<body><main class="card"><div class="logo">KAP Login</div><div class="sub">Secure Telegram Mini App authentication</div><section id="profile" class="profile"><img id="avatar" class="avatar" alt=""><div id="name" class="name">Telegram User</div><div id="tgid" class="id"></div><button id="continueBtn">Continue</button><button id="logoutBtn" class="secondary">Log out</button></section><div id="msg" class="msg">Opening secure login…</div><div class="muted">Telegram identity is verified server-side. This page never asks for Telegram or ProRewards OTP.</div></main>
<script>
const tg=window.Telegram?.WebApp,$=id=>document.getElementById(id);if(tg){tg.ready();tg.expand();}
async function request(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:'Invalid server response'}));if(!r.ok||!d.ok)throw new Error(d.error||'Login failed');return d}
function show(u){$('msg').textContent='Login successful';$('msg').className='msg ok';$('profile').classList.add('show');$('name').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||'Telegram User';$('tgid').textContent='Telegram ID: '+u.id;if(u.photo_url)$('avatar').src=u.photo_url;else $('avatar').style.display='none'}
async function load(){try{const e=await request('/api/miniapp');if(e.authenticated){show(e.user);return}}catch(e){}if(!tg?.initData){$('msg').textContent='Please open this page from the Telegram bot.';$('msg').className='msg err';return}try{const d=await request('/api/miniapp',{method:'POST',body:JSON.stringify({initData:tg.initData})});show(d.user)}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}}
$('logoutBtn').onclick=async()=>{try{await request('/api/miniapp',{method:'DELETE'});location.reload()}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}};$('continueBtn').onclick=()=>tg?.close();load();
</script></body></html>
